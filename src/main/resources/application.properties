spring.datasource.url=jdbc:postgresql://localhost:5432/pulsepass
spring.datasource.username=pulsepass
spring.datasource.password=pulsepass

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Estrategia de precios (capa de servicios)
pulsepass.pricing.base-price=150000.00

# --- Seguridad / JWT (Fase 4) ---
# La clave viene SOLO del entorno (Base64 de >= 32 bytes). Si falta, la app NO arranca.
pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64}
pulsepass.security.jwt.access-token-ttl=PT15M
