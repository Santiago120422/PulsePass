services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsepass
      POSTGRES_USER: pulsepass
      POSTGRES_PASSWORD: pulsepass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pulsepass", "-d", "pulsepass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
